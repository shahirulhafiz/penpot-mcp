workflow_instructions: |
  # Design Quality Workflow
  
  This workflow enforces best practices for creating maintainable, consistent, and efficient Penpot designs.
  
  ## Validation Protocol
  
  **IMPORTANT:** ALWAYS run `validate_design` after making significant design changes to catch issues early.
  
  The validation tool checks for:
  - **Content clipping** - Elements extending beyond parent bounds
  - **Inconsistent spacing** - Non-standard gap and padding values
  - **Poor layer naming** - Generic names like "Rectangle 47"
  - **Missing layout systems** - Boards without flex/grid layouts
  - **Accessibility issues** - Text too small, interactive elements too small
  
  ### When to Validate
  
  Run `validate_design` in these situations:
  1. After creating a new component or section
  2. After repositioning or resizing multiple elements
  3. Before finalizing a design for handoff
  4. When troubleshooting visual issues
  5. After applying bulk changes
  
  ## Standard Spacing Scale
  
  **ALWAYS USE THESE VALUES** for gaps and padding:
  
  | Name | Value | Use Case |
  |------|-------|----------|
  | xs   | 4px   | Tight spacing within components (button text padding, icon spacing) |
  | sm   | 8px   | Small spacing for related elements (list item gaps, form field groups) |
  | md   | 12px  | Medium spacing for component internals (card content padding) |
  | lg   | 16px  | Large spacing between components (default gap for most containers) |
  | xl   | 24px  | Extra large for section spacing (between major groups) |
  | xxl  | 32px  | Maximum for major sections (page-level divisions) |
  
  ### Spacing Best Practices
  
  - Use **lg (16px)** as default for most flex containers
  - Use **md (12px)** for compact lists or tight layouts
  - Use **xl (24px)** or **xxl (32px)** for padding in cards and panels
  - Use **sm (8px)** for tightly packed elements like tag lists
  - **NEVER** use arbitrary values like 15px, 18px, 23px - snap to the scale
  
  ## Layout System Rules
  
  ### When to Use Flex Layout
  
  **ALWAYS** use flex layout for:
  - Navigation bars (horizontal/row)
  - Button groups (horizontal/row)
  - Stats or metrics rows (horizontal/row)
  - Form fields (vertical/column)
  - Card content (vertical/column)
  - Sidebar menus (vertical/column)
  - Any list of elements (row or column based on direction)
  
  **NEVER** use manual positioning (absolute x/y) for lists of elements.
  
  ### When to Use Grid Layout
  
  Use grid layout for:
  - Dashboard layouts with fixed columns
  - Card grids (product listings, galleries)
  - Complex multi-column forms
  - Calendar or table structures
  - Magazine-style layouts
  
  ### When to Use Manual Positioning
  
  Manual positioning is ONLY appropriate for:
  - Decorative elements (backgrounds, illustrations)
  - Overlapping elements (badges on avatars, notification dots)
  - Absolutely positioned items (tooltips, modals, popovers)
  - Single unique elements that don't repeat
  
  ## Layer Naming Conventions
  
  Follow these naming rules for ALL layers:
  
  ### Format: Title Case
  
  - ✅ Good: "Submit Button", "User Card", "Header Logo"
  - ❌ Bad: "submit button", "SUBMIT BUTTON", "submitButton"
  
  ### Be Descriptive
  
  - ✅ Good: "Primary Action Button", "User Avatar Image", "Search Input Field"
  - ❌ Bad: "Rectangle 47", "Ellipse 12", "Frame 234", "Group 8"
  
  ### Include Context
  
  - ✅ Good: "Header Logo", "Footer Copyright Text", "Sidebar Navigation"
  - ❌ Bad: "Logo", "Text", "Navigation"
  
  ### For Variants
  
  Use **Base + Variant** pattern:
  - ✅ Good: "Button Primary", "Button Secondary", "Button Danger"
  - ✅ Good: "Card Default", "Card Highlighted", "Card Disabled"
  - ❌ Bad: "PrimaryButton", "button-secondary", "Danger_Button"
  
  ## Component Organization
  
  ### Hierarchy Depth Limit
  
  **Maximum recommended nesting: 4-5 levels**
  
  Example of good hierarchy:
  ```
  Page Root (Level 0)
  └── Header Section (Level 1)
      └── Navigation Container (Level 2)
          └── Nav Item (Level 3)
              └── Nav Icon (Level 4)
  ```
  
  If you exceed 5 levels, consider:
  1. Creating a reusable component
  2. Flattening the hierarchy
  3. Restructuring the layout
  
  ### Grouping Rules
  
  Always group related elements:
  1. **Functional Groups** - Elements that work together (form field + label + error)
  2. **Layout Groups** - Elements sharing layout behavior (row of buttons)
  3. **Section Groups** - Major page divisions (header, main, footer)
  
  ## Common Design Issues & Solutions
  
  ### Issue: Content Clipping
  
  **Symptoms:** Text or elements cut off at container edges
  
  **Solutions:**
  1. Run `detect_clipping` to find all clipping issues
  2. Increase parent container size
  3. Apply flex layout for automatic content handling
  4. Reduce child element size if appropriate
  
  ### Issue: Z-Order Problems (Elements Not Visible)
  
  **Symptoms:** Text or content not rendering, elements appear missing, backgrounds covering content
  
  **Root Cause:** When using `appendChild()`, elements are added to the FRONT (highest index).
  If a background panel is added LATER in the code (e.g., during refactoring), it covers everything.
  
  **Solutions:**
  1. Run `fix_z_order` to detect z-order inversions
  2. Use `fix_z_order` with `autoFix: true` to automatically reorder elements
  3. Manual fix: `penpotUtils.fixZOrder(container)` to sort children by priority
  4. Verify z-order after bulk element creation by exporting and inspecting visually
  
  **Prevention:**
  - Add background elements FIRST when creating designs programmatically
  - Use descriptive names for backgrounds (include 'BG', 'Background', 'Panel')
  - Always run `validate_design` after creating elements to catch z-order issues
  
  ### Issue: Inconsistent Spacing
  
  **Symptoms:** Uneven gaps, different spacing in similar components
  
  **Solutions:**
  1. Run `fix_spacing` to detect non-standard values
  2. Use `fix_spacing` with `autoFix: true` to snap to scale
  3. Apply presets with `apply_spacing_scale` (compact/default/spacious)
  
  ### Issue: Poor Layer Names
  
  **Symptoms:** Generic names like "Rectangle 47", "Group 12"
  
  **Solutions:**
  1. Run `audit_layer_names` to find poorly named layers
  2. Use `audit_layer_names` with `autoRename: true` for automatic suggestions
  3. Manually rename following Title Case convention
  
  ### Issue: Missing Layout Systems
  
  **Symptoms:** Boards with manual positioning, layouts break on edits
  
  **Solutions:**
  1. Add flex layout: `board.addFlexLayout()`
  2. Configure direction: `board.flex.dir = "row"` or `"column"`
  3. Set gaps: `board.flex.rowGap = 16` and `board.flex.columnGap = 16`
  4. Set padding: `board.flex.verticalPadding = 24`, `board.flex.horizontalPadding = 24`
  
  ## Accessibility Requirements
  
  ### Minimum Text Size
  
  - **Never** use text smaller than 12px
  - **Recommended** minimum: 14px for body text
  - **Headings:** 16px and larger
  
  ### Interactive Element Size
  
  - **Minimum touch target:** 44x44px
  - Applies to: buttons, links, icons, form controls
  - Add padding if the element itself is smaller
  
  ### Color Contrast
  
  - Ensure sufficient contrast between text and background
  - Use design tokens instead of arbitrary hex codes
  - Validate contrast ratios for accessibility compliance
  
  ## Workflow Integration
  
  ### Recommended Workflow
  
  #### For New Designs
  
  1. **Plan** - Define hierarchy and spacing before creating
  2. **Structure** - Create containers with flex/grid layouts
  3. **Backgrounds First** - Add background elements BEFORE content (critical for z-order)
  4. **Content** - Add elements and group immediately
  5. **Name** - Use descriptive names as you create (especially 'BG' for backgrounds)
  6. **Validate** - Run `validate_design` to catch issues (includes z-order checks)
  7. **Auto-Fix** - Run auto-fix tools in this order:
     - `fix_z_order` with `autoFix: true` (z-order issues)
     - `fix_clipping` with strategy `auto` (clipping issues)
     - `fix_spacing` with `autoFix: true` (spacing issues)
  8. **Refine** - Use `audit_layer_names`, `auto_size_container` as needed
  9. **Final Check** - Run `validate_design` one more time
  
  #### For Existing Designs
  
  1. **Analyze** - Run `analyze_structure` to understand the design
  2. **Review Layout** - Run `suggest_layout` on key containers
  3. **Validate** - Run `validate_design` to find all issues
  4. **Fix** - Apply fixes using the tools (see Quick Fix Sequence below)
  5. **Optimize** - Use `auto_size_container` to eliminate wasted space
  
  #### Quick Fix Sequence (One-Command Flow)
  
  When you have multiple issues, run these tools in order:
  
  ```
  1. fix_z_order (autoFix: true)     → Ensure visibility
  2. fix_clipping (strategy: auto)   → Ensure containment
  3. auto_size_container (mode: fit) → Optimize container sizes
  4. fix_spacing (autoFix: true)     → Standardize spacing
  5. audit_layer_names (autoRename: true) → Clean up names
  6. validate_design                  → Verify all fixed
  ```
  
  ### Quality Checklist
  
  Before finalizing any design, ensure:
  - ✅ All elements are within parent bounds (no clipping)
  - ✅ Z-order is correct (backgrounds at back, text at front)
  - ✅ Spacing uses standard scale values
  - ✅ All layers have descriptive names
  - ✅ Containers use flex/grid layouts (not manual positioning)
  - ✅ Text is at least 12px
  - ✅ Interactive elements are at least 44x44px
  - ✅ Hierarchy depth is 5 levels or less
  
  ## Available Tools
  
  ### validate_design
  Comprehensive QA check covering all aspects of design quality.
  Run this FIRST to get an overview of issues.
  
  ### detect_clipping
  Focused tool for finding content overflow issues.
  Use when you specifically need to check containment.
  
  ### fix_clipping ⭐ NEW
  **Automatically fixes** clipping issues with multiple strategies:
  - `expand-parent`: Resize parent to fit children (adds padding)
  - `reposition-child`: Move children within parent bounds
  - `apply-flex`: Add flex layout for automatic handling
  - `auto`: Choose best strategy per issue (recommended)
  Use `dryRun: true` to preview changes before applying.
  
  ### fix_spacing
  Detects and optionally fixes non-standard spacing values.
  Use with `autoFix: true` to automatically snap to scale.
  
  ### audit_layer_names
  Finds poorly named layers and suggests improvements.
  Use with `autoRename: true` to automatically apply suggestions.
  
  ### apply_spacing_scale
  Applies consistent spacing preset to a container.
  Quick way to standardize spacing: compact/default/spacious.
  
  ### fix_z_order
  Detects and fixes z-order issues where backgrounds cover content.
  Critical when creating designs programmatically (appendChild adds to front).
  Use with `autoFix: true` to automatically reorder elements by priority.
  
  ### auto_size_container ⭐ NEW
  Automatically resizes containers to fit their content with configurable padding.
  Modes:
  - `fit`: Resize to exactly fit content (default)
  - `fit-expand-only`: Only expand, never shrink
  - `fit-shrink-only`: Only shrink, never expand
  Great for fixing containers that are too small (clipping) or too large (wasted space).
  
  ### suggest_layout ⭐ NEW
  Analyzes a container's children and suggests optimal flex/grid configuration.
  Examines child positions, dimensions, and types to recommend:
  - Direction (row or column)
  - Alignment (start, center, end)
  - Gap and padding values
  Use `autoApply: true` to automatically configure the layout.
  
  ### analyze_structure ⭐ NEW
  Analyzes the structure and hierarchy of a design:
  - Detects ungrouped related elements
  - Finds missing intermediate containers
  - Identifies deep nesting (>5 levels)
  - Shows hierarchy visualization
  - Calculates health score
  Run this when starting work on an existing design to understand its structure.
  
  ## Design-to-Code Handoff Tools
  
  ### extract_design_specs ⭐ NEW
  Extracts detailed design specifications from any shape:
  - Dimensions, positions, colors
  - Typography settings
  - Layout configuration (flex/grid)
  - Border and shadow properties
  Formats: JSON (structured), CSS (direct styling), Markdown (documentation)
  
  ### generate_css_variables ⭐ NEW
  Generates CSS custom properties from a design:
  - Extracts colors, dimensions, spacing, typography
  - Creates :root CSS variables with semantic names
  - Organizes by element or property type
  Use for maintaining design-code consistency and design systems.
  
  ### generate_component_spec ⭐ NEW
  Creates comprehensive component documentation:
  - Component structure tree
  - Color palette extraction
  - Typography catalog
  - State detection (hover, active, disabled, etc.)
  - Implementation recommendations
  Perfect for developer handoff documentation.
  
  ## Examples
  
  ### Example 1: Creating a Card Component
  
  ```javascript
  // 1. Create container with flex layout
  const card = penpot.createBoard();
  card.name = "User Card";
  card.addFlexLayout();
  card.flex.dir = "column";
  card.flex.rowGap = 16;  // lg spacing
  card.flex.verticalPadding = 24;  // xl padding
  card.flex.horizontalPadding = 24;
  
  // 2. Add content
  const avatar = penpot.createEllipse();
  avatar.name = "User Avatar";
  card.appendChild(avatar);
  
  const name = penpot.createText("User Name");
  name.name = "User Name Text";
  card.appendChild(name);
  
  // 3. Validate
  // Run validate_design on the card
  ```
  
  ### Example 2: Fixing Spacing Issues
  
  ```javascript
  // 1. Detect issues
  // Run: fix_spacing with target: "page"
  
  // 2. Review suggestions
  
  // 3. Auto-fix
  // Run: fix_spacing with target: "page", autoFix: true
  ```
  
  ### Example 3: Bulk Rename Layers
  
  ```javascript
  // 1. Audit names
  // Run: audit_layer_names with target: "page"
  
  // 2. Review suggestions
  
  // 3. Auto-rename
  // Run: audit_layer_names with target: "page", autoRename: true
  ```
  
  ---
  
  Remember: Quality designs are maintainable designs. Following these best practices
  ensures your designs are consistent, scalable, and easy to work with over time.
